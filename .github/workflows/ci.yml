name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: node scripts/audit-catalogue.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  stock-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: ^3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase
        run: supabase start >/dev/null
      - name: Verify authenticated browser sessions and access controls
        shell: bash
        run: |
          settings="$(supabase status -o json)"
          export VITE_SUPABASE_URL="$(jq -er '.API_URL' <<< "$settings")"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$(jq -er '.PUBLISHABLE_KEY // .ANON_KEY' <<< "$settings")"
          export LOCAIZ_LOCAL_ADMIN_KEY="$(jq -er '.SECRET_KEY // .SERVICE_ROLE_KEY' <<< "$settings")"
          export LOCAIZ_PILOT_PASSWORD="$(openssl rand -hex 18)"
          echo "::add-mask::$LOCAIZ_LOCAL_ADMIN_KEY"
          echo "::add-mask::$LOCAIZ_PILOT_PASSWORD"
          node scripts/seed-stock-pilot.mjs
          unset LOCAIZ_LOCAL_ADMIN_KEY
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/sourcing-rls.sql
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/market-foundation-rls.sql
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "insert into sourcing_private.operators select id from auth.users where email='seller-c@stock.example.com';"
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/buyer-seller-journey-rls.sql
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/pickup-reservations-rls.sql
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/seed-journey-browser.sql
          docker exec -i supabase_db_locaiz psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/market-review-rls.sql
          export VITE_MARKETPLACE_FOUNDATION=1
          export LOCAIZ_MAILPIT_URL="$(jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"' <<< "$settings")"
          npm run build
          npm run test:e2e -- --grep '@stock|@market|@journey'
      - if: always()
        run: supabase stop
